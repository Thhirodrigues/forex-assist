<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Forex Assist - Real Money</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- Links para arquivos externos (agora hospedados na raiz do seu repo) -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-512.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

    <!-- Seu estilo permanece idêntico ao original -->
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{margin:0;padding:0;height:100%}
        body{background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;overscroll-behavior:none}
        .app{max-width:560px;margin:0 auto;padding:14px 14px 40px;min-height:100%}
        header{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 20px}
        .title{font-weight:800;font-size:17px;letter-spacing:.2px}
        .subtitle{font-size:11px;color:#94a3b8;margin-top:2px}
        .badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px}
        .badge.ativo{background:#16a34a;color:#fff;box-shadow:0 0 14px rgba(22,163,74,.35)}
        .badge.desativado{background:#dc2626;color:#fff}
        .icon-btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;transition:.2s}
        .icon-btn:active{transform:scale(.96)}
        .btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:15px;margin:8px 0;color:#fff;cursor:pointer;transition:.2s;letter-spacing:.3px}
        .btn:active{transform:translateY(1px)}
        .btn-blue{background:linear-gradient(180deg,#3b82f6,#2563eb);box-shadow:0 8px 20px rgba(37,99,235,.25)}
        .btn-green{background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 8px 20px rgba(22,163,74,.25)}
        .btn-red{background:linear-gradient(180deg,#ef4444,#dc2626);box-shadow:0 8px 20px rgba(220,38,38,.25)}
        .btn:disabled{opacity:.6;filter:grayscale(.3)}
        .info{text-align:center;color:#94a3b8;font-size:12.5px;margin:12px 0 14px;font-weight:500}
        .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
        .card{background:#1e293b;border:1px solid #2a364a;padding:13px 8px;border-radius:14px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
        .card-value{font-size:21px;font-weight:800;color:#f8fafc}
        .card-label{font-size:10.5px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
        .section{background:#1e293b;border:1px solid #2a364a;border-radius:16px;padding:14px;margin:14px 0}
        .section-title{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
        .pairs-list{font-size:12.5px;color:#cbd5e1;line-height:1.5;word-break:break-word}
        .log{background:#0b1220;border:1px solid #1e293b;border-radius:12px;padding:10px 12px;height:300px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;scroll-behavior:smooth}
        .log-entry{color:#94a3b8;white-space:pre-wrap}
        .log-signal{color:#22c55e;font-weight:700}
        .log-error{color:#f87171}
        .log-warn{color:#fbbf24}
        .modal{position:fixed;inset:0;background:rgba(2,6,23,.85);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50}
        .modal.show{display:flex}
        .modal-content{background:#1e293b;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:20px;border:1px solid #334155;border-bottom:none;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .modal-header h3{margin:0;font-size:18px;font-weight:800}
        .close-btn{background:#0f172a;border:1px solid #334155;color:#cbd5e1;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
        label{font-size:12.5px;color:#cbd5e1;font-weight:600;display:block;margin-top:10px}
        .input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:11px 12px;border-radius:11px;margin:6px 0 10px;font-size:14px;outline:none;transition:.2s}
        .input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
        .pairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
        .pairs-grid label{display:flex;align-items:center;gap:9px;background:#0f172a;padding:10px 11px;border-radius:10px;border:1px solid #334155;cursor:pointer;transition:.2s;margin:0;font-weight:500;font-size:13.5px}
        .pairs-grid label:has(input:checked){border-color:#3b82f6;background:#142040}
        .pairs-grid input{width:18px;height:18px;accent-color:#2563eb;flex-shrink:0;margin:0}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
        .small{font-size:11px;color:#64748b;margin-top:4px}
        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <div class="title">Forex Assist</div>
                <div class="subtitle" style="font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px">Real Money <img src="icon-512.png" alt="" style="height:18px;width:18px;vertical-align:middle;opacity:1"></div>
            </div>
            <div style="display:flex;gap:9px;align-items:center">
                <span id="badge" class="badge desativado">DESATIVADO</span>
                <button id="btnSettings" class="icon-btn" aria-label="Configurações"><span style="font-size:22px">⚙️</span></button>
            </div>
        </header>

        <button id="btnNotify" class="btn btn-blue">ATIVAR NOTIFICAÇÕES</button>
        <button id="btnScanner" class="btn btn-green">INICIAR SCANNER</button>

        <div id="infoLine" class="info">Horários: 07:30-18:00 • Lote 0.04 • TP/SL $5/$5</div>

        <div class="cards">
            <div class="card"><div id="statSinais" class="card-value">0</div><div class="card-label">Sinais</div></div>
            <div class="card"><div id="statTP" class="card-value">0</div><div class="card-label">TP</div></div>
            <div class="card"><div id="statSL" class="card-value">0</div><div class="card-label">SL</div></div>
            <div class="card"><div id="statAcerto" class="card-value">0%</div><div class="card-label">Acerto %</div></div>
        </div>

        <div class="section">
            <div class="section-title"><span>Pares ativos</span><span id="pairCount" style="color:#60a5fa;font-weight:700">7/14</span></div>
            <div id="pairsList" class="pairs-list"></div>
        </div>

        <div class="section">
            <div class="section-title"><span>Log em tempo real</span><button id="clearLog" style="background:none;border:none;color:#94a3b8;font-size:12px;cursor:pointer">Limpar</button></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <!-- Modal de Configurações permanece o mesmo -->
    <div id="settingsModal" class="modal">
        <!-- (Conteúdo do modal não alterado) -->
    </div>

    <script>
        // Registrar o arquivo físico sw.js
        if('serviceWorker' in navigator){
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(r => console.log('SW registrado', r))
                .catch(e => console.log('Erro no SW', e));
            });
        }

        // Restante da sua lógica JavaScript original abaixo...
        // [Cole aqui a partir da linha: "const $=s=>document.querySelector(s);" até o fim]
    </script>
</body>
</html>
