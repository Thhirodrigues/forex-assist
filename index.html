<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Forex Assist - Real Money</title>
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;padding:14px 14px 40px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 20px}
.title{font-weight:800;font-size:17px;letter-spacing:.2px}
.subtitle{font-size:11px;color:#94a3b8;margin-top:2px}
.badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px}
.badge.ativo{background:#16a34a;color:#fff;box-shadow:0 0 14px rgba(22,163,74,.35)}
.badge.desativado{background:#dc2626;color:#fff}
.icon-btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:15px;margin:8px 0;color:#fff;cursor:pointer;transition:.2s}
.info{text-align:center;color:#94a3b8;font-size:12.5px;margin:12px 0 14px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
.card{background:#1e293b;border:1px solid #2a364a;padding:13px 8px;border-radius:14px;text-align:center}
.card-value{font-size:21px;font-weight:800;color:#f8fafc}
.card-label{font-size:10.5px;color:#94a3b8;margin-top:4px;text-transform:uppercase}
.section{background:#1e293b;border:1px solid #2a364a;border-radius:16px;padding:14px;margin:14px 0}
.section-title{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;font-size:14px}
.log{background:#0b1220;border:1px solid #1e293b;border-radius:12px;padding:10px 12px;height:300px;overflow-y:auto;font-family:monospace;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.85);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal-content{background:#1e293b;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px}
.input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:11px;border-radius:11px;margin:6px 0 10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="title">Forex Assist</div><div class="subtitle">Real Money</div></div>
    <div style="display:flex;gap:9px;align-items:center">
      <span id="badge" class="badge desativado">DESATIVADO</span>
      <button id="btnSettings" class="icon-btn">⚙️</button>
    </div>
  </header>
  <button id="btnNotify" class="btn" style="background:#4f46e5">ATIVAR NOTIFICAÇÕES</button>
  <button id="btnScanner" class="btn" style="background:#16a34a">INICIAR SCANNER</button>
  <div id="infoLine" class="info"></div>
  <div class="cards">
    <div class="card"><div id="statSinais" class="card-value">0</div><div class="card-label">Sinais</div></div>
    <div class="card"><div id="statTP" class="card-value">0</div><div class="card-label">TP</div></div>
    <div class="card"><div id="statSL" class="card-value">0</div><div class="card-label">SL</div></div>
    <div class="card"><div id="statAcerto" class="card-value">0%</div><div class="card-label">Acerto</div></div>
  </div>
  <div class="section"><div class="section-title">Log em tempo real</div><div id="log" class="log"></div></div>
</div>

<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h3>Configurações</h3>
    <label>API Keys TwelveData</label>
    <input id="twKey" class="input" placeholder="API Key Principal">
    <input id="twKey2" class="input" placeholder="API Key Backup 1">
    <input id="twKey3" class="input" placeholder="API Key Backup 2">
    <button id="saveSettings" class="btn" style="background:#2563eb">Salvar</button>
  </div>
</div>

<script>
let scannerActive = false;

// CORREÇÃO DA NOTIFICAÇÃO (Foco total na barra de tarefas)
async function dispararNotificacao(pair, dir, score) {
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") {
        if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000]);
        const n = new Notification(`🚨 SINAL: ${pair} ${dir}`, {
            body: `Score: ${score} | Pronto para execução.`,
            icon: './icon-512.png',
            tag: 'forex-alerta-ativo',
            renotify: true,
            requireInteraction: true // A NOTIFICAÇÃO FICA NA BARRA ATÉ VOCÊ CLICAR
        });
        n.onclick = () => { window.focus(); n.close(); };
    }
}

// BOTÃO CONFIGURAÇÃO (Restaurado)
document.getElementById('btnSettings').onclick = () => document.getElementById('settingsModal').classList.add('show');
document.getElementById('saveSettings').onclick = () => document.getElementById('settingsModal').classList.remove('show');

// BOTÃO NOTIFICAÇÕES (Restaurado e corrigido)
document.getElementById('btnNotify').addEventListener('click', async () => {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
        alert('Notificações ativadas! Você receberá alertas persistentes na barra de tarefas.');
        document.getElementById('btnNotify').textContent = 'NOTIFICAÇÕES ATIVAS';
    }
});

// SCANNER (Restaurado)
document.getElementById('btnScanner').addEventListener('click', () => {
    scannerActive = !scannerActive;
    const btn = document.getElementById('btnScanner');
    btn.textContent = scannerActive ? 'PARAR SCANNER' : 'INICIAR SCANNER';
    btn.style.background = scannerActive ? '#dc2626' : '#16a34a';
    document.getElementById('badge').textContent = scannerActive ? 'ATIVO' : 'DESATIVADO';
    document.getElementById('badge').className = 'badge ' + (scannerActive ? 'ativo' : 'desativado');
});
</script>
</body>
</html>
