name: Forex Scanner Real

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          echo '{
            "name":"forex-real",
            "version":"2.0.0"
          }' > package.json

      - name: Install Dependencies
        run: |
          npm install firebase-admin@11.11.1 axios

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
          cat serviceAccount.json | head -c 100
          
      - name: Run Scanner
        env:
          API_KEY_1: ${{ secrets.TWELVEDATA_KEY }}
          API_KEY_2: ${{ secrets.TWELVEDATA_KEY_2 }}
          API_KEY_3: ${{ secrets.TWELVEDATA_KEY_3 }}
        run: |
          cat > scanner.js << 'EOF'

          const admin = require("firebase-admin");
          const axios = require("axios");

          const serviceAccount =
            require("./serviceAccount.json");

          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          const COOLDOWN_MINUTOS = 30;

          const apiKeys = [
            process.env.API_KEY_1,
            process.env.API_KEY_2,
            process.env.API_KEY_3
          ];

          function getApiKey() {
            return apiKeys[
              Math.floor(Math.random() * apiKeys.length)
            ];
          }

          const principais = [
            "EUR/USD",
            "GBP/USD",
            "USD/JPY",
            "AUD/USD",
            "USD/CAD"
          ];

          const secundarios = [
            "EUR/JPY",
            "GBP/JPY",
            "EUR/GBP",
            "AUD/JPY",
            "EUR/AUD",
            "GBP/AUD",
            "CHF/JPY"
          ];

          function calcularEMA(valores, periodo) {

            const k = 2 / (periodo + 1);

            let ema = valores[valores.length - 1];

            for (let i = valores.length - 2; i >= 0; i--) {
              ema =
                (valores[i] * k) +
                (ema * (1 - k));
            }

            return ema;
          }

          function calcularRSI(closes, periodo = 14) {

            let ganhos = 0;
            let perdas = 0;

            for (let i = 1; i <= periodo; i++) {

              const diff =
                closes[i - 1] - closes[i];

              if (diff > 0)
                ganhos += diff;
              else
                perdas += Math.abs(diff);
            }

            if (perdas === 0)
              return 100;

            const rs =
              ganhos / perdas;

            return (
              100 -
              (100 / (1 + rs))
            );
          }

          async function analisarPar(par) {

            try {

              const key = getApiKey();

              const url =
                `https://api.twelvedata.com/time_series?symbol=${par}&interval=5min&outputsize=60&apikey=${key}`;

              const resposta =
                await axios.get(url);

              if (!resposta.data.values)
                return null;

              const closes =
                resposta.data.values
                  .map(c => parseFloat(c.close));

              const ema9 =
                calcularEMA(
                  closes.slice(0, 9),
                  9
                );

              const ema21 =
                calcularEMA(
                  closes.slice(0, 21),
                  21
                );

              const ema21Anterior =
                calcularEMA(
                  closes.slice(1, 22),
                  21
                );

              const rsi =
                calcularRSI(closes);

              let direcao = null;

              if (
                ema9 > ema21 &&
                ema21 > ema21Anterior &&
                rsi > 55
              ) {
                direcao = "CALL";
              }

              if (
                ema9 < ema21 &&
                ema21 < ema21Anterior &&
                rsi < 45
              ) {
                direcao = "PUT";
              }

              if (!direcao)
                return null;

              let qualidade = 85;

              qualidade += Math.min(
                15,
                Math.round(
                  Math.abs(ema21 - ema21Anterior) * 10000
                )
              );

              return {
                par,
                direcao,
                qualidade,
                ema9:
                  Number(ema9.toFixed(5)),
                ema21:
                  Number(ema21.toFixed(5)),
                rsi:
                  Number(rsi.toFixed(2))
              };

            } catch (e) {

              console.log(
                "Erro:",
                par
              );

              return null;
            }
          }
               async function executar() {

               const statusDoc = await db
                                     .collection("scanner")
                                     .doc("status")
                                    .get();

               const status = statusDoc.data() || {};

               if (status.ativo === false) {

              console.log(
             "Scanner desativado pelo aplicativo"
              );

             return;

              }

              let melhor = null;

            for (const par of principais) {

              const sinal =
                await analisarPar(par);

              if (
                sinal &&
                sinal.qualidade >= 88 &&
                (
                  !melhor ||
                  sinal.qualidade >
                  melhor.qualidade
                )
              ) {
                melhor = sinal;
              }
            }

            if (!melhor) {

              for (const par of secundarios) {

                const sinal =
                  await analisarPar(par);

                if (
                  sinal &&
                  sinal.qualidade >= 88 &&
                  (
                    !melhor ||
                    sinal.qualidade >
                    melhor.qualidade
                  )
                ) {
                  melhor = sinal;
                }
              }
            }

            if (!melhor) {

              console.log(
                "Nenhum sinal >= 88"
              );

              return;
            }


            const historico = await db
              .collection("historico")
              .orderBy("timestamp", "desc")
              .limit(50)
              .get();

            let bloqueado = false;

            const agora = Date.now();

            historico.forEach(doc => {

              const dados = doc.data();

              if (
                dados.par !== melhor.par ||
                dados.direcao !== melhor.direcao ||
                !dados.timestamp
              ) return;

              const ultimo =
                dados.timestamp.toDate().getTime();

              const minutos =
                (agora - ultimo) / 60000;

              if (minutos < COOLDOWN_MINUTOS)
                bloqueado = true;

            });

            if (bloqueado) {

              console.log(
                "Cooldown ativo: " +
                melhor.par +
                " " +
                melhor.direcao
              );

              return;

            }

            const sinal = {
              ...melhor,
              horario:
                new Date()
                .toLocaleTimeString(
                  "pt-BR"
                ),
              timestamp:
                admin.firestore.Timestamp.now(),
              modo: "EXPERT",
              origem: "scanner"
            };

            await db
              .collection("historico")
              .add(sinal);

            const tokensSnapshot = await db
              .collection("tokens")
              .where("ativo", "==", true)
              .get();

            const tokens = [];

            tokensSnapshot.forEach(doc => {

              const dados = doc.data();

              if (dados.token) {
                tokens.push(dados.token);
              }

            });

            if (tokens.length > 0) {

              try {

                const resultado =
                  await admin.messaging()
                    .sendEachForMulticast({

                      tokens,

                      notification: {
                        title: "Forex Assist",
                        body: `${sinal.par} ${sinal.direcao} ${sinal.qualidade}%`
                      },

                      data: {
                        par: sinal.par,
                        direcao: sinal.direcao,
                        qualidade: String(sinal.qualidade)
                      }

                    });

                console.log(
                  `Push enviado: ${resultado.successCount}/${tokens.length}`
                );

              } catch (erro) {

                console.log(
                  "Erro FCM:",
                  erro.message
                );

              }

            }

            await db
                              .collection("scanner")
                              .doc("status")
                              .set({
           ultimaAnalise:
          sinal.par,
                ultimoSinal:
                  `${sinal.par} ${sinal.direcao}`,
                sinaisHoje:
                  admin.firestore
                    .FieldValue
                    .increment(1)
              }, {
                merge: true
              });

            console.log(
              "Melhor sinal:",
              sinal
            );
          }

          executar();

          EOF

          node scanner.js
          
