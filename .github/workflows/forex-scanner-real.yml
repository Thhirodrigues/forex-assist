name: Forex Scanner Real

on:
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          echo '{
            "name":"forex-real",
            "version":"1.0.0"
          }' > package.json

      - name: Install Dependencies
        run: |
          npm install firebase-admin axios

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Run Scanner
        env:
          API_KEY_1: ${{ secrets.TWELVEDATA_KEY }}
          API_KEY_2: ${{ secrets.TWELVEDATA_KEY_2 }}
          API_KEY_3: ${{ secrets.TWELVEDATA_KEY_3 }}
        run: |
          cat > scanner.js << 'EOF'

          const admin = require("firebase-admin");
          const axios = require("axios");

          const serviceAccount =
            require("./serviceAccount.json");

          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          const pares = [
            "EUR/USD",
            "GBP/USD",
            "USD/JPY",
            "AUD/USD",
            "USD/CAD",
            "EUR/JPY",
            "GBP/JPY"
          ];

          const apiKeys = [
            process.env.API_KEY_1,
            process.env.API_KEY_2,
            process.env.API_KEY_3
          ];

          function getApiKey() {
            return apiKeys[
              Math.floor(Math.random() * apiKeys.length)
            ];
          }

          function calcularEMA(valores, periodo) {

            const k = 2 / (periodo + 1);

            let ema = valores[0];

            for (let i = 1; i < valores.length; i++) {

              ema =
                valores[i] * k +
                ema * (1 - k);

            }

            return ema;
          }

          function calcularRSI(
            fechamentos,
            periodo = 14
          ) {

            let ganhos = 0;
            let perdas = 0;

            for (
              let i = 1;
              i <= periodo;
              i++
            ) {

              const diff =
                fechamentos[i - 1] -
                fechamentos[i];

              if (diff > 0) {

                ganhos += diff;

              } else {

                perdas += Math.abs(diff);

              }

            }

            if (perdas === 0) {
              return 100;
            }

            const rs =
              ganhos / perdas;

            return (
              100 -
              (100 / (1 + rs))
            );
          }

          async function executar() {

            const par =
              pares[
                Math.floor(
                  Math.random() *
                  pares.length
                )
              ];

            const key =
              getApiKey();

            const url =
              `https://api.twelvedata.com/time_series?symbol=${par}&interval=5min&outputsize=100&apikey=${key}`;

            const resposta =
              await axios.get(url);

            if (
              !resposta.data.values
            ) {

              throw new Error(
                "Sem dados"
              );

            }

            const fechamentos =
              resposta.data.values.map(
                c =>
                  parseFloat(
                    c.close
                  )
              );

            const ema9 =
              calcularEMA(
                fechamentos
                  .slice(0, 9)
                  .reverse(),
                9
              );

            const ema21 =
              calcularEMA(
                fechamentos
                  .slice(0, 21)
                  .reverse(),
                21
              );

            const rsi =
              calcularRSI(
                fechamentos
              );

            let direcao =
              null;

            let qualidade =
              0;

            if (
              ema9 > ema21 &&
              rsi > 55
            ) {

              direcao =
                "CALL";

              qualidade =
                Math.min(
                  99,
                  Math.round(
                    85 +
                    (rsi - 55) +
                    (
                      (ema9 - ema21)
                      * 10000
                    )
                  )
                );

            } else if (
              ema9 < ema21 &&
              rsi < 45
            ) {

              direcao =
                "PUT";

              qualidade =
                Math.min(
                  99,
                  Math.round(
                    85 +
                    (45 - rsi) +
                    (
                      (ema21 - ema9)
                      * 10000
                    )
                  )
                );

            }

            await db
              .collection(
                "scanner"
              )
              .doc("status")
              .set({

                ativo: true,

                ultimaAnalise:
                  par,

                ema9:
                  Number(
                    ema9.toFixed(5)
                  ),

                ema21:
                  Number(
                    ema21.toFixed(5)
                  ),

                rsi:
                  Number(
                    rsi.toFixed(2)
                  )

              }, {
                merge: true
              });

            if (!direcao) {

              console.log(
                "Sem sinal"
              );

              return;

            }

            const sinal = {

              par,

              direcao,

              qualidade,

              horario:
                new Date()
                .toLocaleTimeString(
                  "pt-BR"
                ),

              modo:
                "EXPERT",

              origem:
                "scanner",

              ema9:
                Number(
                  ema9.toFixed(5)
                ),

              ema21:
                Number(
                  ema21.toFixed(5)
                ),

              rsi:
                Number(
                  rsi.toFixed(2)
                )

            };

            await db
              .collection(
                "historico"
              )
              .add(sinal);

            await db
              .collection(
                "scanner"
              )
              .doc("status")
              .set({

                ativo: true,

                ultimoSinal:
                  `${par} ${direcao}`,

                sinaisHoje:
                  admin.firestore.FieldValue.increment(
                    1
                  )

              }, {
                merge: true
              });

            console.log(
              sinal
            );

          }

          executar();

          EOF

          node scanner.js
