name: Caminho do dia - lucro antes da perda e regras de parada (somente leitura)

# Pedido do usuario (22/11/2026). Le o `historico` oficial (admin); descritivo; nao altera nada.
on:
  workflow_dispatch:

jobs:
  dia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/relatorio/dia-caminho.test.js && node scripts/relatorio/risco-simulacao.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/relatorio/dia-caminho.js
