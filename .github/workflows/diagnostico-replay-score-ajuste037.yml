name: Diagnóstico - replay do score (AJUSTE-037)

# Ferramenta administrativa avulsa, SÓ LEITURA, NÃO faz parte do
# pipeline de análise/decisão do produto. Só dispara manualmente
# (workflow_dispatch), nunca por cron. Roda
# ferramentas/diagnostico-replay-score-ajuste037.js, que reprocessa as
# operações fechadas pelo motor de score do checkout (rodar com ref =
# branch da mudança) - AJUSTE-037, 28/09/2026. Não escreve nada no Firestore.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Replay do score
        run: |
          node ferramentas/diagnostico-replay-score-ajuste037.js
