name: Diagnóstico - discriminação do score

# Ferramenta administrativa avulsa, SÓ LEITURA, NÃO faz parte do
# pipeline de análise/decisão do produto. Só dispara manualmente
# (workflow_dispatch), nunca por cron. Roda
# ferramentas/diagnostico-discriminacao-score.js, que investiga
# por que o score não discrimina WIN de LOSS (rótulo limpo vs
# contaminado, desempate, alvo em ATR, AUC por componente) -
# AJUSTE-031, 26/09/2026. Não escreve nada no Firestore.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Diagnóstico discriminação do score
        run: |
          node ferramentas/diagnostico-discriminacao-score.js
