name: XM - comparar o ensaio do executor com os sinais reais do app

# Somente leitura (banco oficial). Compara as linhas FARIA do log do MT5 (scripts/xm/ensaio-*.json) com o `historico`: direção, TP/SL em pips,
# derrapagem de preço e sinais do app que o executor não viu. Não grava nada.
on:
  workflow_dispatch:

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/xm/ensaio-comparar.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/xm/ensaio-comparar.js
