name: Diagnóstico - score alternativo (ADX)

# Ferramenta administrativa avulsa, SÓ LEITURA, NÃO faz parte do
# pipeline de análise/decisão do produto. Só dispara manualmente
# (workflow_dispatch), nunca por cron. Roda
# ferramentas/diagnostico-score-alternativo-adx.js, que testa formalmente
# (AUC, com erro padrão) hipóteses alternativas de score sem o
# componente de ADX/força de tendência - AJUSTE-035, 28/09/2026. Não
# escreve nada no Firestore.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Diagnóstico score alternativo ADX
        run: |
          node ferramentas/diagnostico-score-alternativo-adx.js
