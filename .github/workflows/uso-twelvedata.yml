name: Uso da TwelveData (só leitura)

# Mostra o consumo de créditos das 4 chaves (também roda de hora em hora para registrar a curva do dia) (endpoint /api_usage; NÃO gasta crédito). Não imprime as chaves.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'   # a cada hora: série do consumo por chave no log (calibrar o orçamento; /api_usage não gasta crédito)

jobs:
  uso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consumo por chave
        env:
          K1: ${{ secrets.TWELVEDATA_KEY_1 }}
          K2: ${{ secrets.TWELVEDATA_KEY_2 }}
          K3: ${{ secrets.TWELVEDATA_KEY_3 }}
          K4: ${{ secrets.TWELVEDATA_KEY_4 }}
        run: |
          for n in 1 2 3 4; do
            eval "k=\$K$n"
            echo "--- chave $n ---"
            curl -s "https://api.twelvedata.com/api_usage?apikey=$k" | python3 -c "import sys,json; d=json.load(sys.stdin); print({x:d.get(x) for x in ('timestamp','current_usage','plan_limit','daily_usage','plan_daily_limit','plan_category','code','message')})"
          done
