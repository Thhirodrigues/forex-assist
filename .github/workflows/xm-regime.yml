name: XM - pre-registro 6.51, triagem T1 regime e T2 alinhamento do dolar (somente leitura)

# Pre-registro aprovado pelo usuario em 19/11/2026. Roda UMA vez sobre a triagem (todas as fechadas com velas M5 da XM ate o fim
# da exportacao). Nao altera nada; o pipeline de sinais segue congelado.
on:
  workflow_dispatch:

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/xm/regime.test.js && node scripts/xm/semanas.test.js && node scripts/xm/rejulgar.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/xm/regime.js DOCUMENTACAO/arquivo-xm/xm_barras_M5_*.csv
