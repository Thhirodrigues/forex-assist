name: Forex Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          echo '{
            "name":"forex-scanner",
            "version":"1.0.0"
          }' > package.json

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Run Scanner
        run: |
          cat > scanner.js << 'EOF'

          const admin = require("firebase-admin");
          const serviceAccount = require("./serviceAccount.json");

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          const pares = [
            "EURUSD",
            "GBPUSD",
            "USDJPY",
            "AUDUSD",
            "USDCAD",
            "EURJPY",
            "GBPJPY"
          ];

          const direcoes = ["CALL", "PUT"];

          async function executar() {

            const par =
              pares[Math.floor(Math.random()*pares.length)];

            const direcao =
              direcoes[Math.floor(Math.random()*2)];

            const qualidade =
              (85 + Math.floor(Math.random()*11)) + "%";

            const horario =
              new Date().toLocaleTimeString(
                "pt-BR",
                {
                  hour: "2-digit",
                  minute: "2-digit",
                  hour12: false
                }
              );

            const sinal = {
              par,
              direcao,
              qualidade,
              horario,
              modo: "EXPERT"
            };

            await db.collection("historico").add(sinal);

            const statusRef =
              db.collection("scanner").doc("status");

            const status =
              await statusRef.get();

            const atual =
              status.exists ? status.data() : {};

            await statusRef.set({
              ativo: true,
              sinaisHoje: (atual.sinaisHoje || 0) + 1,
              ultimaAnalise: `Sinal encontrado em ${par}`,
              ultimoSinal: `${par} ${direcao} ${qualidade}`
            });

            console.log("Sinal criado:", sinal);
          }

          executar();

          EOF

          node scanner.js
