name: O dia do app contra o dia da XM, sinal a sinal (somente leitura)

# Pedido do usuario (24/11/2026): "o app e a XM trabalhem iguais". Le o `historico` oficial (admin) e cruza com o arquivo do dia em
# DOCUMENTACAO/xm-executor-dias/ (log do MT5). Nao grava nada.
on:
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia de Brasilia (AAAA-MM-DD); precisa existir DOCUMENTACAO/xm-executor-dias/<dia>.json'
        required: true
        default: '2026-11-24'

jobs:
  dia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/relatorio/hoje-app-xm.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/relatorio/hoje-app-xm.js --dia=${{ github.event.inputs.dia }}
