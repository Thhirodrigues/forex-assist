name: Sombra retrospectiva do executor v1.20 sobre o historico do app (somente leitura)

# Pedido do usuario (23/11/2026): saber com que frequencia cada regra de gestao agiria, antes de ter o log real do v1.20. Le o `historico`
# oficial (admin); descritivo; nao altera nada.
on:
  workflow_dispatch:

jobs:
  sombra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/relatorio/executor-sombra.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/relatorio/executor-sombra.js
