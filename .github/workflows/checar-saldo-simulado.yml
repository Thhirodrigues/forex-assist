name: Checar saldo simulado atual (AJUSTE-039)

# Ferramenta administrativa avulsa, SÓ LEITURA, NÃO faz parte do
# pipeline de análise/decisão do produto. Só dispara manualmente
# (workflow_dispatch), nunca por cron. Roda
# ferramentas/checar-saldo-simulado.js, que lê o saldo simulado atual
# em configuracoes/geral e a banca dos últimos sinais, pra conferir
# o saldo definido na tela de Config - AJUSTE-039, 28/09/2026. Não escreve nada no Firestore.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Checar saldo simulado
        run: |
          node ferramentas/checar-saldo-simulado.js
