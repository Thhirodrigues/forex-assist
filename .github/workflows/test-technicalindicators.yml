name: Test TechnicalIndicators

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Test Library
        run: |
         node -e "
         const { ADX } = require('technicalindicators');

         const highs=[30,32,31,33,35,36,38,37,39,40,42,41,43,45,44];
         const lows=[28,29,29,30,32,33,35,34,36,37,39,38,40,42,41];
         const closes=[29,31,30,32,34,35,37,36,38,39,41,40,42,44,43];

         console.log(JSON.stringify(
         ADX.calculate({
         period:14,
         high:highs,
         low:lows,
         close:closes
         }),
         null,
         2
         ));
         "
