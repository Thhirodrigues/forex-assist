name: Resultados depois da 400a operacao (somente leitura)

# Pedido do usuario (17/11/2026): resultados desde a ultima verificacao (marco das 400, 09/11). Le o historico oficial com a credencial
# de administrador, somente leitura; nao altera nada e nao decide nada.
on:
  workflow_dispatch:

jobs:
  depois:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/relatorio/depois400.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/relatorio/depois400.js
