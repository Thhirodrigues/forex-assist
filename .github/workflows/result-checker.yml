name: Result Check

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

jobs:
  checker:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          echo '{
            "name":"forex-result-check",
            "version":"1.0.0"
          }' > package.json

      - name: Install Dependencies
        run: |
          npm install firebase-admin@11.11.1 axios

      - name: Create Firebase Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Result Checker
        env:
          API_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |

          cat > checker.js << 'EOF'

          const admin = require("firebase-admin");
          const axios = require("axios");

          const serviceAccount =
            require("./serviceAccount.json");

          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          async function executar() {

            const snapshot = await db
              .collection("historico")
              .where("resultado", "==", null)
              .get();

            const agora = Date.now();

            for (const doc of snapshot.docs) {

              const sinal = doc.data();

              if (
                !sinal.timestamp ||
                !sinal.precoEntrada ||
                !sinal.par
              ) continue;

              const entrada =
                sinal.timestamp.toDate().getTime();

              const minutos =
                (agora - entrada) / 60000;

              if (minutos < 15)
                continue;

              try {

                const url =
                  `https://api.twelvedata.com/price?symbol=${sinal.par}&apikey=${process.env.API_KEY}`;

                const resposta =
                  await axios.get(url);

                const precoAtual =
                  Number(resposta.data.price);

                let resultado = "LOSS";

                if (
                  sinal.direcao === "CALL" &&
                  precoAtual >
                  sinal.precoEntrada
                ) {
                  resultado = "WIN";
                }

                if (
                  sinal.direcao === "PUT" &&
                  precoAtual <
                  sinal.precoEntrada
                ) {
                  resultado = "WIN";
                }

                await doc.ref.update({

                  resultado,

                  precoFechamento:
                    precoAtual,

                  horarioResultado:
                    new Date()
                    .toLocaleTimeString(
                      "pt-BR"
                    )

                });

                console.log(
                  `${sinal.par} -> ${resultado}`
                );

              } catch (erro) {

                console.log(
                  "Erro:",
                  sinal.par,
                  erro.message
                );

              }

            }

          }

          executar();

          EOF

          node checker.js
