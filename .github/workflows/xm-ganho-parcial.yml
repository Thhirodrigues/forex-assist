name: XM - ganho intermediario (quantos sinais viraram LOSS depois; somente leitura)

# Pergunta do usuario (24/11/2026). Le o `historico` oficial (admin) e as velas M5 da XM no repositorio. Parte 1: avisoParcial real do app.
# Parte 2: grade fixa de limiares (30/50/60/80% do TP), preco real da XM, bid/ask. Nao grava nada.
on:
  workflow_dispatch:

jobs:
  ganho:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/xm/ganho-parcial.test.js
      - name: Create Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: node scripts/xm/ganho-parcial.js DOCUMENTACAO/arquivo-xm/xm_barras_M5_*.csv
